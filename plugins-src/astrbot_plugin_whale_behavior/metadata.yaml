name: whale_behavior
display_name: 小鲸鱼群聊行为
short_desc: 触发档位（概率插嘴/关键词）+ 静默 + 分句节奏，接近真人混群
desc: >-
  1) 触发档位：群消息没有 @ 机器人时，按 0~100 滑条的概率决定要不要插嘴，命中关键词强制触发；
  2) 冷却：同群 N 秒内最多回一次，避免刷屏；
  3) 静默：模型输出 [SILENT] 或空内容时不发任何消息；
  4) 分句：用 || 把回复拆成多条，带可配置间隔逐条发送，像真人补刀；
  5) 引用/@：按概率引用原消息或 @ 发言者。
version: 0.16.0
author: dsh-agent
astrbot_version: ">=4.0.0"
tags:
  - 群聊
  - 行为
  - 触发
  - 分句





